<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>AI 记账三步走</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
</head>
<body>
<div class="xhs-square padding-m">
  <div class="honey-blob tl"></div>

  <div style="margin-bottom: 32px;">
    <span class="tag-pill sage">AI 记账 · 教程</span>
  </div>

  <h1 class="headline headline-m" style="margin-bottom: 50px;">
    AI 记账<br/>
    <span class="highlight-honey">三步</span>搞定
  </h1>

  <!-- 步骤 -->
  <div style="display: flex; flex-direction: column; gap: 32px; max-width: 1080px; position: relative; z-index: 2;">
    <div style="display: flex; gap: 28px;">
      <div style="font-family: var(--font-script); font-size: 140px; color: var(--honey-deep); line-height: 1; font-weight: 700; min-width: 140px;">1</div>
      <div class="card" style="flex: 1; padding: 36px;">
        <div style="font-size: 36px; font-weight: 700; margin-bottom: 12px;">📱 长按 + 号</div>
        <div style="font-size: 26px; color: var(--text-secondary);">弹出菜单 → 选「AI 助手」/「拍照识别」/「语音」三选一</div>
      </div>
    </div>
    <div style="display: flex; gap: 28px;">
      <div style="font-family: var(--font-script); font-size: 140px; color: var(--sage); line-height: 1; font-weight: 700; min-width: 140px;">2</div>
      <div class="card" style="flex: 1; padding: 36px;">
        <div style="font-size: 36px; font-weight: 700; margin-bottom: 12px;">💬 用人话告诉它</div>
        <div style="font-size: 26px; color: var(--text-secondary);">「中午吃了 38 块的麻辣烫」/ 截图 / 喊一句话<br/>金额、分类、时间它都自己 get</div>
      </div>
    </div>
    <div style="display: flex; gap: 28px;">
      <div style="font-family: var(--font-script); font-size: 140px; color: var(--peach); line-height: 1; font-weight: 700; min-width: 140px;">3</div>
      <div class="card" style="flex: 1; padding: 36px;">
        <div style="font-size: 36px; font-weight: 700; margin-bottom: 12px;">✅ 点确认入账</div>
        <div style="font-size: 26px; color: var(--text-secondary);">解析结果浮在上面 → 一眼核对 → 一键存档<br/>整个流程 5 秒</div>
      </div>
    </div>
  </div>

  <p class="script-accent" style="font-size: 80px; transform: rotate(-2deg); text-align: center; margin-top: 50px;">
    so easy 🤍
  </p>

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
</div>
</body>
</html>
