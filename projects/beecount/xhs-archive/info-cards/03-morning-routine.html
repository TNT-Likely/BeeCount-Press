<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>早晨 5 分钟记账</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
</head>
<body>
<div class="xhs-square padding-m">
  <div class="honey-blob tl"></div>

  <div style="margin-bottom: 32px;">
    <span class="tag-pill peach">生活方式 · 早起记账</span>
  </div>

  <h1 class="headline headline-m" style="margin-bottom: 40px;">
    我的早晨<br/>
    <span class="script-accent" style="font-size: 130px;">5 minutes</span><br/>
    记账 routine
  </h1>

  <!-- 时间线 -->
  <div style="display: flex; flex-direction: column; gap: 24px; max-width: 1000px; position: relative; z-index: 2;">
    <div style="display: flex; gap: 28px; align-items: center;">
      <div style="width: 100px; height: 100px; border-radius: 50%; background: var(--honey); display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: white; flex-shrink: 0;">7:00</div>
      <div class="card" style="flex: 1; padding: 32px;">
        <div style="font-size: 30px; font-weight: 700; margin-bottom: 8px;">☕ 拍下昨天的咖啡小票</div>
        <div style="font-size: 22px; color: var(--text-secondary);">长按 + 号 → 选拍照 → 自动识别金额、商家、分类</div>
      </div>
    </div>
    <div style="display: flex; gap: 28px; align-items: center;">
      <div style="width: 100px; height: 100px; border-radius: 50%; background: var(--sage); display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: white; flex-shrink: 0;">7:02</div>
      <div class="card" style="flex: 1; padding: 32px;">
        <div style="font-size: 30px; font-weight: 700; margin-bottom: 8px;">📋 微信 / 支付宝账单导入</div>
        <div style="font-size: 22px; color: var(--text-secondary);">导出 CSV → App 一键导入 → 重复检测 + 自动归类</div>
      </div>
    </div>
    <div style="display: flex; gap: 28px; align-items: center;">
      <div style="width: 100px; height: 100px; border-radius: 50%; background: var(--peach); display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: white; flex-shrink: 0;">7:04</div>
      <div class="card" style="flex: 1; padding: 32px;">
        <div style="font-size: 30px; font-weight: 700; margin-bottom: 8px;">📊 看一眼月度图表</div>
        <div style="font-size: 22px; color: var(--text-secondary);">这个月在哪超支了一目了然,马上调整</div>
      </div>
    </div>
    <div style="display: flex; gap: 28px; align-items: center;">
      <div style="width: 100px; height: 100px; border-radius: 50%; background: var(--honey-deep); display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: white; flex-shrink: 0;">7:05</div>
      <div class="card" style="flex: 1; padding: 32px;">
        <div style="font-size: 30px; font-weight: 700; margin-bottom: 8px;">✨ 关 App,继续早晨</div>
        <div style="font-size: 22px; color: var(--text-secondary);">不需要每笔手敲,5 分钟解决一周的账</div>
      </div>
    </div>
  </div>

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
</div>
</body>
</html>
