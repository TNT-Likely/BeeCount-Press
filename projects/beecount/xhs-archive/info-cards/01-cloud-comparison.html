<!DOCTYPE html>

<head>

</head>

      <thead>

        <tr style="border-bottom: 1px solid var(--bg-cream-2);">

        <tr style="border-bottom: 1px solid var(--bg-cream-2);">
          <td style="padding: 20px 12px; font-weight: 700; color: var(--text-primary);">📦 WebDAV</td>

          <td style="padding: 20px 12px; color: var(--text-secondary);">完全本地化</td>
        </tr>
        <tr>
          <td style="padding: 20px 12px; font-weight: 700; color: var(--text-primary);">🪣 S3 / R2</td>

          <td style="padding: 20px 12px; color: var(--text-secondary);">10GB 免费</td>

  <p class="script-accent" style="font-size: 70px; transform: rotate(-2deg); margin-top: 40px; text-align: center;">

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
