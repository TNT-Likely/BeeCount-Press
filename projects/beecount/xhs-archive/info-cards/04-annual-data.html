<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>年度数据卡</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
</head>
<body>
<div class="xhs-square padding-m">
  <div class="honey-blob tr"></div>
  <div class="honey-blob br"></div>

  <div style="margin-bottom: 32px; text-align: center;">
    <span class="tag-pill honey">2024 年度账单 · 模板</span>
  </div>

  <h1 class="headline headline-m" style="text-align: center; margin-bottom: 50px;">
    一年下来<br/>
    我的<span class="highlight-honey">钱画像</span>
  </h1>

  <!-- 大数据卡 -->
  <div style="background: linear-gradient(135deg, var(--white) 0%, var(--bg-cream-2) 100%); border-radius: 32px; padding: 56px; box-shadow: var(--shadow-medium); position: relative; z-index: 2; max-width: 1100px; margin: 0 auto;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-bottom: 40px;">
      <div>
        <div style="font-size: 24px; color: var(--text-secondary); margin-bottom: 8px;">总支出</div>
        <div style="font-size: 80px; font-weight: 700; font-family: var(--font-serif); color: var(--text-primary); line-height: 1;">¥86,420</div>
      </div>
      <div>
        <div style="font-size: 24px; color: var(--text-secondary); margin-bottom: 8px;">总收入</div>
        <div style="font-size: 80px; font-weight: 700; font-family: var(--font-serif); color: var(--sage); line-height: 1;">¥124,200</div>
      </div>
    </div>

    <div style="height: 2px; background: var(--bg-cream-2); margin: 40px 0;"></div>

    <div style="margin-bottom: 32px;">
      <div style="font-size: 24px; color: var(--text-secondary); margin-bottom: 16px;">支出 Top 3</div>
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; align-items: center; gap: 16px;">
          <span style="font-size: 36px;">🍔</span>
          <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
              <span style="font-size: 26px; font-weight: 600;">餐饮</span>
              <span style="font-size: 26px; color: var(--text-secondary);">¥18,920 · 22%</span>
            </div>
            <div style="height: 12px; background: var(--bg-cream-2); border-radius: 999px;">
              <div style="height: 100%; width: 22%; background: var(--honey); border-radius: 999px;"></div>
            </div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <span style="font-size: 36px;">🚗</span>
          <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
              <span style="font-size: 26px; font-weight: 600;">交通</span>
              <span style="font-size: 26px; color: var(--text-secondary);">¥14,500 · 17%</span>
            </div>
            <div style="height: 12px; background: var(--bg-cream-2); border-radius: 999px;">
              <div style="height: 100%; width: 17%; background: var(--peach); border-radius: 999px;"></div>
            </div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <span style="font-size: 36px;">🛍️</span>
          <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
              <span style="font-size: 26px; font-weight: 600;">购物</span>
              <span style="font-size: 26px; color: var(--text-secondary);">¥12,300 · 14%</span>
            </div>
            <div style="height: 12px; background: var(--bg-cream-2); border-radius: 999px;">
              <div style="height: 100%; width: 14%; background: var(--sage); border-radius: 999px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="text-align: center; padding-top: 24px; border-top: 2px solid var(--bg-cream-2);">
      <div style="font-size: 28px; color: var(--text-secondary);">结余</div>
      <div style="font-size: 64px; font-weight: 700; font-family: var(--font-serif); color: var(--honey-deep);">+¥37,780</div>
    </div>
  </div>

  <p style="text-align: center; font-size: 28px; color: var(--text-secondary); margin-top: 40px; position: relative; z-index: 2;">
    用蜜蜂记账,做自己钱的主人 💛
  </p>

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
</div>
</body>
</html>
