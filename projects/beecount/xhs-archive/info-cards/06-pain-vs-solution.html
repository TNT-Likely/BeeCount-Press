<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>记账痛点 vs 解决方案</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
</head>
<body>
<div class="xhs-square padding-m">
  <div class="honey-blob br"></div>

  <div style="margin-bottom: 32px;">
    <span class="tag-pill outline">真实测评 · 对比</span>
  </div>

  <h1 class="headline headline-m" style="margin-bottom: 50px;">
    记账总卡这几关?<br/>
    <span class="highlight-honey">蜜蜂帮你过</span>
  </h1>

  <!-- 痛点 vs 解决 -->
  <div style="display: flex; flex-direction: column; gap: 24px; max-width: 1100px; position: relative; z-index: 2;">
    <div style="display: grid; grid-template-columns: 1fr 80px 1fr; gap: 16px; align-items: center;">
      <div style="background: rgba(255,255,255,0.6); border-radius: 24px; padding: 28px 32px; border: 2px dashed var(--text-tertiary);">
        <div style="font-size: 24px; color: var(--text-tertiary); margin-bottom: 8px;">😩 痛点</div>
        <div style="font-size: 28px; color: var(--text-tertiary);">每笔手敲太慢,坚持 3 天就放弃</div>
      </div>
      <div style="text-align: center; font-size: 56px; color: var(--honey);">→</div>
      <div class="card" style="padding: 28px 32px;">
        <div style="font-size: 24px; color: var(--honey-deep); font-weight: 700; margin-bottom: 8px;">✦ 解决</div>
        <div style="font-size: 28px; color: var(--text-primary); font-weight: 500;">AI 对话 / 截图 / 语音三选一,5 秒入账</div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 80px 1fr; gap: 16px; align-items: center;">
      <div style="background: rgba(255,255,255,0.6); border-radius: 24px; padding: 28px 32px; border: 2px dashed var(--text-tertiary);">
        <div style="font-size: 24px; color: var(--text-tertiary); margin-bottom: 8px;">😩 痛点</div>
        <div style="font-size: 28px; color: var(--text-tertiary);">App 突然倒闭,3 年数据全没了</div>
      </div>
      <div style="text-align: center; font-size: 56px; color: var(--honey);">→</div>
      <div class="card" style="padding: 28px 32px;">
        <div style="font-size: 24px; color: var(--honey-deep); font-weight: 700; margin-bottom: 8px;">✦ 解决</div>
        <div style="font-size: 28px; color: var(--text-primary); font-weight: 500;">数据存自己服务器 + 5 种云同步任选</div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 80px 1fr; gap: 16px; align-items: center;">
      <div style="background: rgba(255,255,255,0.6); border-radius: 24px; padding: 28px 32px; border: 2px dashed var(--text-tertiary);">
        <div style="font-size: 24px; color: var(--text-tertiary); margin-bottom: 8px;">😩 痛点</div>
        <div style="font-size: 28px; color: var(--text-tertiary);">Pro 功能要订阅,广告还劝你买理财</div>
      </div>
      <div style="text-align: center; font-size: 56px; color: var(--honey);">→</div>
      <div class="card" style="padding: 28px 32px;">
        <div style="font-size: 24px; color: var(--honey-deep); font-weight: 700; margin-bottom: 8px;">✦ 解决</div>
        <div style="font-size: 28px; color: var(--text-primary); font-weight: 500;">100% 免费 · 0 广告 · 0 推广 · 开源</div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 80px 1fr; gap: 16px; align-items: center;">
      <div style="background: rgba(255,255,255,0.6); border-radius: 24px; padding: 28px 32px; border: 2px dashed var(--text-tertiary);">
        <div style="font-size: 24px; color: var(--text-tertiary); margin-bottom: 8px;">😩 痛点</div>
        <div style="font-size: 28px; color: var(--text-tertiary);">想跟伴侣 / 家人共享一本账,做不到</div>
      </div>
      <div style="text-align: center; font-size: 56px; color: var(--honey);">→</div>
      <div class="card" style="padding: 28px 32px;">
        <div style="font-size: 24px; color: var(--honey-deep); font-weight: 700; margin-bottom: 8px;">✦ 解决</div>
        <div style="font-size: 28px; color: var(--text-primary); font-weight: 500;">BeeCount Cloud 多端实时秒同步</div>
      </div>
    </div>
  </div>

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
</div>
</body>
</html>
