<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>拍照记账</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
</head>
<body>
<div class="xhs-cover padding-l">
  <div class="honey-blob br"></div>
  <div class="honey-blob tl"></div>

  <div style="margin-bottom: 50px;">
    <span class="tag-pill sage">效率工具 · 一秒记账</span>
  </div>

  <h1 class="headline headline-l" style="margin-bottom: 32px;">
    <span class="script-accent" style="font-size: 110px;">snap.</span><br/>
    <span class="highlight-honey">拍照</span> = 记账<br/>
    <span style="font-size: 80px;">每天少花 3 分钟</span>
  </h1>

  <p class="subheadline" style="margin-bottom: 60px; max-width: 950px;">
    截图 / 拍照 / 长按 + 一秒识别金额、商家、分类<br/>
    再也不用一笔一笔手敲
  </p>

  <!-- 流程箭头 -->
  <div style="display: flex; align-items: center; gap: 28px; margin-bottom: 60px;">
    <div class="card" style="text-align: center; padding: 32px 28px;">
      <div style="font-size: 64px; margin-bottom: 8px;">📸</div>
      <div style="font-size: 24px; font-weight: 600;">截图</div>
    </div>
    <div style="font-size: 64px; color: var(--honey);">→</div>
    <div class="card" style="text-align: center; padding: 32px 28px;">
      <div style="font-size: 64px; margin-bottom: 8px;">🤖</div>
      <div style="font-size: 24px; font-weight: 600;">AI 识别</div>
    </div>
    <div style="font-size: 64px; color: var(--honey);">→</div>
    <div class="card" style="text-align: center; padding: 32px 28px;">
      <div style="font-size: 64px; margin-bottom: 8px;">✅</div>
      <div style="font-size: 24px; font-weight: 600;">入账</div>
    </div>
  </div>

  <!-- 设备 -->
  <div style="position: absolute; bottom: -120px; right: 80px;">
    <div class="phone-frame tilt-right">
      <img src="../../../demo/preview/zh/13-ocr-recognition.png" alt="OCR 识别" />
    </div>
  </div>

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
</div>
</body>
</html>
