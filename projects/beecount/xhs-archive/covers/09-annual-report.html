<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>年度账单</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
</head>
<body>
<div class="xhs-cover padding-l">
  <div class="honey-blob tl"></div>
  <div class="honey-blob br"></div>

  <div style="margin-bottom: 50px;">
    <span class="tag-pill honey">年度报告 · 治愈版</span>
  </div>

  <h1 class="headline headline-l" style="margin-bottom: 32px;">
    年度账单出炉<br/>
    原来我是个<br/>
    <span class="highlight-honey">生活家 ✨</span>
  </h1>

  <!-- 数据卡片网格 -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1100px; margin-bottom: 60px; position: relative; z-index: 2;">
    <div class="card" style="text-align: center; padding: 40px 32px;">
      <div style="font-size: 28px; color: var(--text-secondary); margin-bottom: 8px;">记账天数</div>
      <div class="card-stat" style="color: var(--honey-deep); font-size: 88px;">365</div>
      <div style="font-size: 22px; color: var(--text-tertiary); margin-top: 8px;">满勤的一年</div>
    </div>
    <div class="card" style="text-align: center; padding: 40px 32px;">
      <div style="font-size: 28px; color: var(--text-secondary); margin-bottom: 8px;">最爱分类</div>
      <div class="card-stat" style="color: var(--peach); font-size: 64px;">☕ 咖啡</div>
      <div style="font-size: 22px; color: var(--text-tertiary); margin-top: 8px;">¥3,478 · 占比 12%</div>
    </div>
    <div class="card" style="text-align: center; padding: 40px 32px;">
      <div style="font-size: 28px; color: var(--text-secondary); margin-bottom: 8px;">最大单笔</div>
      <div class="card-stat" style="color: var(--sage); font-size: 64px;">¥12,800</div>
      <div style="font-size: 22px; color: var(--text-tertiary); margin-top: 8px;">那次北海道</div>
    </div>
    <div class="card" style="text-align: center; padding: 40px 32px;">
      <div style="font-size: 28px; color: var(--text-secondary); margin-bottom: 8px;">总结余</div>
      <div class="card-stat" style="color: var(--honey-deep); font-size: 64px;">+¥38K</div>
      <div style="font-size: 22px; color: var(--text-tertiary); margin-top: 8px;">比去年涨 22%</div>
    </div>
  </div>

  <p class="subheadline" style="text-align: center;">
    每一笔都被温柔记下,陪你看见自己 💛
  </p>

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
</div>
</body>
</html>
