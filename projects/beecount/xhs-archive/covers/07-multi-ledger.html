<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>三本账本</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
</head>
<body>
<div class="xhs-cover padding-l">
  <div class="honey-blob tl"></div>
  <div class="honey-blob tr"></div>

  <div style="margin-bottom: 50px;">
    <span class="tag-pill peach">生活分账 · 边界感</span>
  </div>

  <h1 class="headline headline-l" style="margin-bottom: 32px;">
    <span class="script-accent" style="font-size: 90px;">three books,</span><br/>
    <span class="highlight-sage">个人 · 家庭 · 出差</span><br/>
    各记各的<br/>
    <span style="font-size: 70px; color: var(--text-secondary); font-weight: 500;">不再混成一锅粥</span>
  </h1>

  <p class="subheadline" style="margin-bottom: 80px; max-width: 950px;">
    每本独立币种、独立预算、独立报表<br/>
    切换账本就像切换衣柜 ✨
  </p>

  <!-- 三本账本叠层 -->
  <div style="position: absolute; bottom: 100px; right: 80px; width: 700px; height: 800px;">
    <div class="phone-frame small" style="position: absolute; top: 0; left: 200px; transform: rotate(-8deg);">
      <img src="../../../demo/preview/zh/01-home.png" alt="个人" />
    </div>
    <div class="phone-frame small" style="position: absolute; top: 80px; left: 100px; transform: rotate(-3deg); opacity: 0.95;">
      <img src="../../../demo/preview/zh/05-ledger-management.png" alt="家庭" />
    </div>
    <div class="phone-frame small" style="position: absolute; top: 160px; left: 0; transform: rotate(2deg); opacity: 0.9;">
      <img src="../../store/raw/zh/06-ledgers.png" alt="出差" />
    </div>
  </div>

  <!-- 账本标签 -->
  <div style="display: flex; gap: 20px; flex-wrap: wrap; max-width: 600px; position: relative; z-index: 2;">
    <span class="tag-pill honey">个人日常</span>
    <span class="tag-pill sage">家庭共享</span>
    <span class="tag-pill peach">出差报销</span>
  </div>

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
</div>
</body>
</html>
