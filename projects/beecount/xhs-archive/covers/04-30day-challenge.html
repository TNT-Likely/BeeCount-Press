<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>30 天挑战</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
</head>
<body>
<div class="xhs-cover padding-l">
  <div class="honey-blob tr"></div>
  <div class="honey-blob br"></div>

  <div style="margin-bottom: 50px;">
    <span class="tag-pill honey">30 天挑战 · 真实记录</span>
  </div>

  <h1 class="headline" style="font-size: 110px; line-height: 1.15; margin-bottom: 32px;">
    每天记账 <span class="big-number" style="font-size: 220px;">30</span> 天<br/>
    <span style="font-size: 80px;">居然真的存下了</span><br/>
    <span class="highlight-honey" style="font-size: 130px; padding: 0 12px;">¥5,217</span>
  </h1>

  <p class="subheadline" style="margin-bottom: 60px; max-width: 950px;">
    写下来才知道哪些钱是真该花,哪些是冲动消费<br/>
    数据自己说话,比任何攻略都有效
  </p>

  <!-- 进度条 -->
  <div style="background: var(--white); border-radius: 32px; padding: 40px 48px; box-shadow: var(--shadow-soft); position: relative; z-index: 2; max-width: 1000px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <span style="font-size: 32px; font-weight: 600;">月度记账打卡</span>
      <span style="font-size: 36px; font-weight: 700; color: var(--honey-deep);">30 / 30</span>
    </div>
    <div style="height: 24px; background: var(--bg-cream-2); border-radius: 999px; overflow: hidden;">
      <div style="height: 100%; width: 100%; background: linear-gradient(90deg, var(--honey) 0%, var(--peach) 100%); border-radius: 999px;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 24px; font-size: 24px; color: var(--text-secondary);">
      <span>D1 · 4 月 1 日</span>
      <span>满勤 ✨</span>
      <span>D30 · 4 月 30 日</span>
    </div>
  </div>

  <!-- 底部 phone frame 半露 -->
  <div style="position: absolute; bottom: -100px; right: 100px;">
    <div class="phone-frame tilt-right">
      <img src="../../../demo/preview/zh/04-chart-analysis.png" alt="数据分析" />
    </div>
  </div>

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
</div>
</body>
</html>
