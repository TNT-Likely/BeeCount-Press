<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>开源记账</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
</head>
<body>
<div class="xhs-cover padding-l">
  <div class="honey-blob tl"></div>

  <div style="margin-bottom: 50px;">
    <span class="tag-pill outline">开源 · 自托管 · 数据自主</span>
  </div>

  <h1 class="headline headline-l" style="margin-bottom: 40px;">
    它的<span class="highlight-honey">代码</span><br/>
    全都摊在<br/>
    <span class="script-accent" style="font-size: 130px;">GitHub</span><br/>
    <span style="font-size: 80px;">谁都能看</span>
  </h1>

  <p class="subheadline" style="margin-bottom: 60px; max-width: 950px;">
    不像那些大厂记账 App,你的数据被打包卖给广告主<br/>
    这个,从头到尾透明给你看
  </p>

  <!-- 代码片段感装饰 -->
  <div style="background: var(--text-primary); border-radius: 24px; padding: 48px; max-width: 1000px; box-shadow: var(--shadow-medium); position: relative; z-index: 2; font-family: 'SF Mono', Menlo, monospace;">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
      <span style="width: 16px; height: 16px; background: #ff5f57; border-radius: 50%;"></span>
      <span style="width: 16px; height: 16px; background: #febc2e; border-radius: 50%;"></span>
      <span style="width: 16px; height: 16px; background: #28c840; border-radius: 50%;"></span>
      <span style="margin-left: 16px; color: #888; font-size: 24px;">github.com/TNT-Likely/BeeCount</span>
    </div>
    <div style="color: #7FB069; font-size: 28px; line-height: 1.6;">
      <span style="color: #B5A795;">// 你的数据,你做主</span><br/>
      <span style="color: #F4A82B;">const</span> <span style="color: #fff;">privacy</span> = <span style="color: #E8B4A0;">"yours"</span>;<br/>
      <span style="color: #F4A82B;">const</span> <span style="color: #fff;">code</span> = <span style="color: #E8B4A0;">"open"</span>;<br/>
      <span style="color: #F4A82B;">const</span> <span style="color: #fff;">price</span> = <span style="color: #E8B4A0;">"free"</span>;
    </div>
  </div>

  <!-- 信任 badge -->
  <div style="display: flex; gap: 24px; margin-top: 60px; flex-wrap: wrap; position: relative; z-index: 2;">
    <span class="tag-pill outline">⭐ GitHub Star</span>
    <span class="tag-pill outline">🔓 100% 开源</span>
    <span class="tag-pill outline">🛡️ 0 追踪</span>
  </div>

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
</div>
</body>
</html>
