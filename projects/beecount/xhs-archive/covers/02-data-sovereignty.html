<!DOCTYPE html>
<html lang="zh">
<head>

<title>数据自主</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
</head>
<body>
<div class="xhs-cover padding-l">

  <div style="margin-bottom: 60px;">

    <div class="card" style="padding: 40px; text-align: center; min-width: 200px;">

    </div>
  </div>

  <p class="script-accent" style="font-size: 100px; transform: rotate(-2deg); margin-left: 40px;">
    your data, your way ✨
  </p>

  <div class="bee-watermark">蜜蜂记账 BeeCount</div>
