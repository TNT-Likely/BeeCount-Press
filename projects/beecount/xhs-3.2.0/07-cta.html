<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>07 · 立即开始</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
<link rel="stylesheet" href="series.css" />
<style>
  .cover {
    background: var(--text-primary);
    color: var(--white);
  }
  .cover .top-row .brand-chip .name { color: var(--white); }
  .cover .top-row .page-no { color: var(--honey); }
  .cover .top-row .page-no .total { color: rgba(255, 255, 255, 0.4); }
  .cover .eyebrow.dark { background: var(--honey); color: var(--text-primary); }
  .cover .title { color: var(--white); }
  .cover .title .accent { color: var(--honey); }
  .cover .title .accent::after { background: rgba(244, 168, 43, 0.22); }
  .cover .sub { color: rgba(255, 255, 255, 0.7); }

  /* 搜索框风格的视觉中心 */
  .search-stage {
    width: 100%;
    background: linear-gradient(135deg, #2a221c 0%, #1c1611 100%);
    border-radius: 28px;
    padding: 48px 44px;
    border: 2px solid rgba(244, 168, 43, 0.18);
    margin-bottom: 28px;
  }
  .search-stage .label {
    font-size: 22px;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .search-stage .label .badge {
    background: var(--honey);
    color: var(--text-primary);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 18px;
    font-weight: 700;
  }
  .search-stage .search-bar {
    background: var(--white);
    border-radius: 18px;
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .search-stage .search-bar .ic {
    color: var(--text-tertiary);
    flex-shrink: 0;
  }
  .search-stage .search-bar .ic svg { width: 32px; height: 32px; }
  .search-stage .search-bar .q {
    flex: 1;
    font-family: var(--font-serif);
    font-size: 44px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -1px;
  }
  .search-stage .search-bar .cursor {
    display: inline-block;
    width: 4px;
    height: 44px;
    background: var(--honey);
    vertical-align: middle;
    margin-left: 4px;
  }
  .search-stage .platform-row {
    display: flex;
    gap: 12px;
    margin-top: 18px;
  }
  .search-stage .platform-row .p {
    flex: 1;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 600;
    color: var(--white);
  }
  .search-stage .platform-row .p .ic {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    color: var(--honey);
  }
  .search-stage .platform-row .p .ic svg { width: 26px; height: 26px; fill: currentColor; }

  /* GitHub 卡片 — 单独突出,因为是允许的链接 */
  .gh-card {
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 22px;
    padding: 26px 28px;
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 22px;
  }
  .gh-card .ic {
    width: 70px; height: 70px;
    border-radius: 18px;
    background: rgba(244, 168, 43, 0.16);
    display: flex; align-items: center; justify-content: center;
    color: var(--honey);
    flex-shrink: 0;
  }
  .gh-card .ic svg { width: 38px; height: 38px; fill: currentColor; }
  .gh-card .body { flex: 1; min-width: 0; }
  .gh-card .body .label {
    font-size: 20px;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 4px;
  }
  .gh-card .body .value {
    font-family: var(--font-sans);
    font-size: 30px;
    font-weight: 700;
    color: var(--white);
    word-break: break-all;
    line-height: 1.2;
  }
  .gh-card .stars {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }
  .gh-card .stars .lbl {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.5);
  }
  .gh-card .stars .star {
    color: var(--honey);
    font-size: 26px;
    font-family: var(--font-script);
  }

  .promise {
    background: rgba(244, 168, 43, 0.14);
    border: 1px solid rgba(244, 168, 43, 0.25);
    border-radius: 18px;
    padding: 22px 28px;
    text-align: center;
    font-size: 24px;
    color: rgba(255, 255, 255, 0.92);
    line-height: 1.5;
  }
  .promise strong { color: var(--honey); font-weight: 700; }

  .cover .footer .sign { color: rgba(255, 255, 255, 0.45); }
  .cover .footer .sign strong { color: var(--honey); }
</style>
</head>
