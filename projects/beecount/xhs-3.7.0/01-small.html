<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>01 · BeeCount 3.7.0 桌面小组件 · 小尺寸</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
<link rel="stylesheet" href="series.css" />
<style>
  .cover {
    background:
      radial-gradient(circle at 92% -5%, rgba(244, 168, 43, 0.42) 0%, transparent 50%),
      radial-gradient(circle at -10% 110%, rgba(232, 180, 160, 0.4) 0%, transparent 50%),
      var(--bg-cream);
  }

  /* 真实 app logo(白色圆角托底,替代原 emoji) */
  .brand-chip .logo {
    background: var(--white);
    box-shadow: 0 6px 16px rgba(61, 51, 39, 0.14);
    padding: 7px;
  }
  .brand-chip .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* 小尺寸 4 款:2×2,正方形画框 */
  .size-grid {
    width: 100%;
    max-width: 812px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    align-content: center;
  }
  .cell {
    background: var(--white);
    border-radius: 28px;
    box-shadow: var(--shadow-soft);
    padding: 20px 20px 14px;
    display: flex;
    flex-direction: column;
  }
  .cell .frame {
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    overflow: hidden;
    background: var(--bg-cream-2);
  }
  .cell .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cell .meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 6px 2px;
  }
  .cell .meta .nm { font-family: var(--font-serif); font-size: 30px; font-weight: 700; }
  .cell .meta .sz { font-family: var(--font-script); font-size: 32px; color: var(--honey-deep); font-weight: 700; }

  .star-deco {
    position: absolute;
    font-family: var(--font-script);
    color: var(--honey);
    line-height: 1;
    z-index: 1;
    opacity: 0.65;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="blob honey" style="right: -250px; top: -200px;"></div>
  <div class="blob peach" style="left: -180px; bottom: -120px;"></div>
  <span class="star-deco" style="left: 60px; top: 270px; font-size: 56px;">✦</span>
  <span class="star-deco" style="right: 120px; bottom: 250px; font-size: 44px;">✧</span>

  <div class="top-row">
    <div class="page-no">01<span class="sep">/</span><span class="total">03</span></div>
    <div class="brand-chip">
      <div class="logo"><img src="assets/logo.png" alt="BeeCount" /></div>
      <div class="name">BeeCount · 蜜蜂记账</div>
    </div>
  </div>

  <span class="eyebrow">v3.7.0 · 桌面小组件全面升级</span>

  <h1 class="title">
    不打开 App,把账本<span class="accent">钉在桌面</span>上
  </h1>

  <div class="visual">
    <div class="size-grid">
      <div class="cell">
        <div class="frame"><img src="assets/widget_preview_glance_small.png" alt="收支速览" /></div>
        <div class="meta"><span class="nm">收支速览</span><span class="sz">小</span></div>
      </div>
      <div class="cell">
        <div class="frame"><img src="assets/widget_preview_networth_small.png" alt="净资产" /></div>
        <div class="meta"><span class="nm">净资产</span><span class="sz">小</span></div>
      </div>
      <div class="cell">
        <div class="frame"><img src="assets/widget_preview_quickadd.png" alt="快速记账" /></div>
        <div class="meta"><span class="nm">快速记账</span><span class="sz">小</span></div>
      </div>
      <div class="cell">
        <div class="frame"><img src="assets/widget_preview_budget.png" alt="预算进度" /></div>
        <div class="meta"><span class="nm">预算进度</span><span class="sz">小</span></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="ver-chip new"><span class="label">★</span> 6 类 × 12 种规格</span>
    <span class="sign">→ 翻页看中 / 大尺寸 · <strong>github.com/TNT-Likely/BeeCount</strong></span>
  </div>
</div>
</body>
</html>
