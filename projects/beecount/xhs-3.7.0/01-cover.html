<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>01 · BeeCount 3.7.0 桌面小组件 · 封面</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
<link rel="stylesheet" href="series.css" />
<style>
  /* 封面:桌面小组件全面升级 —— 真实组件图斜拼主视觉 */
  .cover {
    background:
      radial-gradient(circle at 92% -5%, rgba(244, 168, 43, 0.42) 0%, transparent 50%),
      radial-gradient(circle at -10% 110%, rgba(232, 180, 160, 0.4) 0%, transparent 50%),
      var(--bg-cream);
  }

  /* 6 类组件 chips(沿用 3.2.0 feature-chips 语言) */
  .feature-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
  }
  .feature-chips .chip {
    background: var(--white);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 16px rgba(61, 51, 39, 0.05);
  }
  .feature-chips .chip .num {
    font-family: var(--font-serif);
    color: var(--honey-deep);
    font-weight: 700;
  }
  .feature-chips .chip.new {
    background: var(--text-primary);
    color: var(--white);
  }
  .feature-chips .chip.new .num { color: var(--honey); }

  /* 主视觉:真实组件截图斜拼 */
  .widget-stage {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .widget-stage .shot {
    position: absolute;
    background: var(--white);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: var(--shadow-medium);
  }
  .widget-stage .shot img { display: block; width: 100%; }
  .widget-stage .w1 { width: 58%; left: 0; top: 5%; transform: rotate(-2.2deg); z-index: 3; }
  .widget-stage .w2 { width: 38%; right: 0; top: 2%; transform: rotate(2deg); z-index: 2; }
  .widget-stage .w3 { width: 62%; left: 10%; bottom: 7%; transform: rotate(1.6deg); z-index: 4; }

  /* 手写批注(呼应 3.2.0 的 scribble 装饰) */
  .widget-stage .note {
    position: absolute;
    font-family: var(--font-script);
    color: var(--honey-deep);
    font-size: 42px;
    font-weight: 700;
    transform: rotate(-4deg);
    z-index: 5;
  }
  .widget-stage .note .arrow { font-size: 36px; }

  /* 装饰星(3.2.0 系列同款:absolute 散落,不占文档流) */
  .star-deco {
    position: absolute;
    font-family: var(--font-script);
    color: var(--honey);
    line-height: 1;
    z-index: 1;
    opacity: 0.65;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="blob honey" style="right: -250px; top: -200px;"></div>
  <div class="blob peach" style="left: -180px; bottom: -120px;"></div>
  <span class="star-deco" style="left: 60px; top: 265px; font-size: 56px;">✦</span>
  <span class="star-deco" style="right: 130px; top: 700px; font-size: 40px;">✧</span>
  <span class="star-deco" style="left: 96px; bottom: 260px; font-size: 48px;">✦</span>

  <div class="top-row">
    <div class="page-no">01<span class="sep">/</span><span class="total">02</span></div>
    <div class="brand-chip">
      <div class="logo">🐝</div>
      <div class="name">BeeCount · 蜜蜂记账</div>
    </div>
  </div>

  <span class="eyebrow">
    <span class="pulse"></span>
    v3.7.0 · 桌面小组件全面升级
  </span>

  <h1 class="title">
    <span class="scribble">不打开 App,</span>
    把账本<span class="accent">钉在桌面</span>上
  </h1>

  <div class="feature-chips">
    <span class="chip"><span class="num">01</span>收支速览</span>
    <span class="chip"><span class="num">02</span>净资产</span>
    <span class="chip"><span class="num">03</span>快速记账</span>
    <span class="chip"><span class="num">04</span>预算进度</span>
    <span class="chip"><span class="num">05</span>最近交易</span>
    <span class="chip new"><span class="num">06</span>综合仪表盘</span>
  </div>

  <div class="visual">
    <div class="widget-stage">
      <div class="shot w1"><img src="assets/widget_preview_glance.png" alt="收支速览" /></div>
      <div class="shot w2"><img src="assets/widget_preview_networth_small.png" alt="净资产" /></div>
      <div class="shot w3"><img src="assets/widget_preview_budget_medium.png" alt="预算进度" /></div>
      <span class="note" style="right: 2%; top: 42%;">真实渲染 <span class="arrow">↓</span></span>
    </div>
  </div>

  <div class="footer">
    <span class="ver-chip new"><span class="label">★</span> 6 类 × 12 种规格 · 一点直达记账</span>
    <span class="sign">→ 翻页看全家福 · <strong>github.com/TNT-Likely/BeeCount</strong></span>
  </div>
</div>

</body>
</html>
