<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>02 · BeeCount 3.7.0 桌面小组件 · 中尺寸</title>
<link rel="stylesheet" href="../../../shared/shared.css" />
<link rel="stylesheet" href="series.css" />
<style>
  .cover {
    background:
      radial-gradient(circle at -8% -6%, rgba(127, 176, 105, 0.22) 0%, transparent 45%),
      radial-gradient(circle at 108% 108%, rgba(244, 168, 43, 0.36) 0%, transparent 50%),
      var(--bg-cream);
  }

  /* 真实 app logo(白色圆角托底) */
  .brand-chip .logo {
    background: var(--white);
    box-shadow: 0 6px 16px rgba(61, 51, 39, 0.14);
    padding: 7px;
  }
  .brand-chip .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* 中尺寸 5 款:flex 换行,2+2+1 自动居中 */
  .size-grid {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: center;
    align-content: center;
  }
  .cell {
    width: 505px;
    background: var(--white);
    border-radius: 26px;
    box-shadow: var(--shadow-soft);
    padding: 18px 18px 12px;
    display: flex;
    flex-direction: column;
  }
  .cell .frame {
    aspect-ratio: 21 / 10;
    border-radius: 16px;
    overflow: hidden;
    background: var(--bg-cream-2);
  }
  .cell .frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .cell .meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 12px 4px 2px;
  }
  .cell .meta .nm { font-family: var(--font-serif); font-size: 28px; font-weight: 700; }
  .cell .meta .sz { font-family: var(--font-script); font-size: 30px; color: var(--honey-deep); font-weight: 700; }

  .star-deco {
    position: absolute;
    font-family: var(--font-script);
    color: var(--honey);
    line-height: 1;
    z-index: 1;
    opacity: 0.65;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="blob sage" style="left: -160px; top: -140px;"></div>
  <div class="blob honey" style="right: -220px; bottom: -180px;"></div>
  <span class="star-deco" style="right: 110px; top: 250px; font-size: 52px;">✦</span>

  <div class="top-row">
    <div class="page-no">02<span class="sep">/</span><span class="total">03</span></div>
    <div class="brand-chip">
      <div class="logo"><img src="assets/logo.png" alt="BeeCount" /></div>
      <div class="name">BeeCount · 蜜蜂记账</div>
    </div>
  </div>

  <span class="eyebrow sage">中尺寸 · 关键信息一屏</span>

  <h1 class="title small">
    一块中号,<span class="accent">关键都在</span>
  </h1>

  <div class="visual" style="margin-top: 4px;">
    <div class="size-grid">
      <div class="cell">
        <div class="frame"><img src="assets/widget_preview_glance.png" alt="收支速览" /></div>
        <div class="meta"><span class="nm">收支速览</span><span class="sz">中</span></div>
      </div>
      <div class="cell">
        <div class="frame"><img src="assets/widget_preview_networth.png" alt="净资产" /></div>
        <div class="meta"><span class="nm">净资产</span><span class="sz">中</span></div>
      </div>
      <div class="cell">
        <div class="frame"><img src="assets/widget_preview_quickadd_medium.png" alt="快速记账" /></div>
        <div class="meta"><span class="nm">快速记账</span><span class="sz">中</span></div>
      </div>
      <div class="cell">
        <div class="frame"><img src="assets/widget_preview_budget_medium.png" alt="预算进度" /></div>
        <div class="meta"><span class="nm">预算进度</span><span class="sz">中</span></div>
      </div>
      <div class="cell">
        <div class="frame"><img src="assets/widget_preview_recent.png" alt="最近交易" /></div>
        <div class="meta"><span class="nm">最近交易</span><span class="sz">中</span></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="ver-chip new"><span class="label">★</span> 6 类 × 12 种规格</span>
    <span class="sign">→ 翻页看大尺寸 · <strong>github.com/TNT-Likely/BeeCount</strong></span>
  </div>
</div>
</body>
</html>
